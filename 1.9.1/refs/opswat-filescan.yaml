openapi: 3.0.2
info:
  title: OPSWAT Filescan
  version: '1.0'
  description: >
    ## Developer Guide

    This is the API documentation for OPSWAT Filescan API. If you would like to
    evaluate or have any questions about this documentation, please contact us
    via our [Contact Us](https://www.opswat.com/contact) form.
paths:
  /api/reports/search:
    get:
      tags:
        - reports
      parameters:
        - name: age
          description: Search reports with age of "age" days
          schema:
            title: Age
            description: Search reports with age of "age" days
            default: -1
            type: integer
          in: query
          required: false
        - name: page
          description: Page number starting from 1
          schema:
            title: Page
            description: Page number starting from 1
            default: 1
            type: integer
          in: query
          required: false
        - name: page_size
          description: Page size
          schema:
            description: Page size
            default: 10
            allOf:
              - $ref: '#/components/schemas/REPORTS_SEARCH_PAGE_SIZE_OPTIONS'
          in: query
          required: false
        - name: method
          schema:
            default: and
            allOf:
              - $ref: '#/components/schemas/ReportSearchMethod'
          in: query
          required: false
        - name: query
          schema:
            title: Query
            type: string
          in: query
          required: false
        - name: filename
          schema:
            title: Filename
            type: string
          in: query
          required: false
        - name: source_type
          schema:
            $ref: '#/components/schemas/ReportsSourceType'
          in: query
          required: false
        - name: filetype
          schema:
            $ref: '#/components/schemas/FileType'
          in: query
          required: false
        - name: media_type
          schema:
            title: Media Type
            type: string
          in: query
          required: false
        - name: verdict
          schema:
            $ref: '#/components/schemas/Verdict'
          in: query
          required: false
        - name: tag
          schema:
            title: Tag
            type: string
          in: query
          required: false
        - name: tags
          schema:
            title: Tags
            type: string
          in: query
          required: false
        - name: date_from
          schema:
            format: date
            title: Date From
            type: string
          in: query
          required: false
        - name: date_to
          schema:
            format: date
            title: Date To
            type: string
          in: query
          required: false
        - name: rate_from
          schema:
            title: Rate From
            type: integer
          in: query
          required: false
        - name: rate_to
          schema:
            title: Rate To
            type: integer
          in: query
          required: false
        - name: domain
          schema:
            title: Domain
            type: string
          in: query
          required: false
        - name: ip
          schema:
            title: Ip
            type: string
          in: query
          required: false
        - name: url
          schema:
            title: Url
            type: string
          in: query
          required: false
        - name: uuid
          schema:
            title: Uuid
            type: string
          in: query
          required: false
        - name: email
          schema:
            title: Email
            type: string
          in: query
          required: false
        - name: registry_path
          schema:
            title: Registry Path
            type: string
          in: query
          required: false
        - name: revision_save_id
          schema:
            title: Revision Save Id
            type: string
          in: query
          required: false
        - name: sha1
          schema:
            title: Sha1
            type: string
          in: query
          required: false
        - name: sha256
          schema:
            title: Sha256
            type: string
          in: query
          required: false
        - name: sha512
          schema:
            title: Sha512
            type: string
          in: query
          required: false
        - name: md5
          schema:
            title: Md5
            type: string
          in: query
          required: false
        - name: imphash
          schema:
            title: Imphash
            type: string
          in: query
          required: false
        - name: ssdeep
          schema:
            title: Ssdeep
            type: string
          in: query
          required: false
        - name: fuzzyfsiohash
          schema:
            title: Fuzzyfsiohash
            type: string
          in: query
          required: false
        - name: authentihash
          schema:
            title: Authentihash
            type: string
          in: query
          required: false
        - name: yara_rule
          schema:
            title: Yara Rule
            type: string
          in: query
          required: false
        - name: retry_count
          schema:
            title: Retry Count
            type: integer
          in: query
          required: false
        - name: scan_init_id
          schema:
            title: Scan Init Id
            type: string
          in: query
          required: false
        - name: report_id
          schema:
            title: Report Id
            type: string
          in: query
          required: false
        - name: signal_groups
          schema:
            title: Signal Groups
            type: string
          in: query
          required: false
        - name: mitre_techniques
          schema:
            title: Mitre Techniques
            type: string
          in: query
          required: false
        - name: verdict_groups
          schema:
            title: Verdict Groups
            type: string
          in: query
          required: false
        - name: main_task_state
          schema:
            default: success
            allOf:
              - $ref: '#/components/schemas/MainTaskSimplifiedState'
          in: query
          required: false
        - name: exclude
          schema:
            title: Exclude
            type: string
          in: query
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportSearchResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Bad request
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: search_report_api_reports_search_get
      summary: Search Report
      description: >-
        Search for reports.


        Finds reports and uploaded files by various tokens, like hash, filename,
        verdict, IOCs etc. 


        If `query` param is used, other params are ignored.
  /api/backend/reputation:
    get:
      tags:
        - backend
      parameters:
        - name: sha256
          description: >-
            SHA256 digest as found in the response of submit or extracted
            resource in the report.
          schema:
            title: SHA256 digest
            description: >-
              SHA256 digest as found in the response of submit or extracted
              resource in the report.
            type: string
          in: query
          required: false
        - name: hashes
          description: Array of one or more hashes
          schema:
            title: Hashes
            description: Array of one or more hashes
            type: array
            items:
              type: string
          in: query
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_reputation_api_backend_reputation_get
      summary: Get Reputation
      description: Wrapper for reputation api
  /api/docs:
    get:
      tags:
        - docs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_api_docs_api_docs_get
      summary: Get API Docs
      description: Return API docs UI
  /api/docs/sitemap:
    get:
      tags:
        - docs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_sitemap_api_docs_sitemap_get
      summary: Get Sitemap
      description: Get sitemap xml
  /api/docs/styles:
    get:
      tags:
        - docs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_api_docs_styles_api_docs_styles_get
      summary: Get API Doc Styles
      description: Return styles for api docs
  /api/feed/info:
    get:
      tags:
        - feed
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_feed_info_api_feed_info_get
      summary: Get Feed Info
      description: Get reports feed info
  '/api/files/{hash}':
    get:
      tags:
        - files
      parameters:
        - name: hash
          description: File hash
          schema:
            title: Hash
            description: File hash
            type: string
          in: path
          required: true
        - name: report_id
          description: Report Id
          schema:
            title: Report Id
            description: Report Id
            type: string
          in: query
          required: false
        - name: type
          schema:
            default: base64
            allOf:
              - $ref: '#/components/schemas/ContentType'
          in: query
          required: false
        - name: original_name
          schema:
            title: Original Name
            default: false
            type: boolean
          in: query
          required: false
        - name: password
          description: Password to be used on compression
          schema:
            title: Zipped content of file
            description: Password to be used on compression
            type: string
          in: query
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Item not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_single_file_api_files__hash__get
      summary: Get Single File
      description: Obtain single file for given report by file id or hash
  /openapi.json:
    get:
      tags:
        - docs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_open_api_endpoint_openapi_json_get
      summary: Get OpenAPI Endpoint
      description: Return API json data to be used by docs UI
  /api/users/uploads:
    get:
      tags:
        - users
      parameters:
        - name: page
          description: Page number starting from 1
          schema:
            title: Page
            description: Page number starting from 1
            default: 1
            type: integer
          in: query
          required: false
        - name: page_size
          description: Page size
          schema:
            description: Page size
            default: 10
            allOf:
              - $ref: '#/components/schemas/REPORTS_SEARCH_PAGE_SIZE_OPTIONS'
          in: query
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Bad request
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_uploads_api_users_uploads_get
      summary: Get Uploads
      description: Get list of uploaded files
  /api/users/most-interesting:
    get:
      tags:
        - reports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_most_interesting_api_users_most_interesting_get
      summary: Get Most Interesting
      description: Get most interesting report recently
  /api/users/get-frequent-tags:
    get:
      tags:
        - reports
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_frequent_tags_api_users_get_frequent_tags_get
      summary: Get Frequent Tags
      description: Get most frequently seen tags recently
  '/api/users/{account_id}/avatar':
    get:
      tags:
        - users
      parameters:
        - name: account_id
          schema:
            title: Account Id
            type: string
          in: path
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_avatar_image_api_users__account_id__avatar_get
      summary: Get Avatar Image
      description: Get use avatar image
  '/api/system/translations/{lang}':
    get:
      tags:
        - system
      parameters:
        - name: lang
          schema:
            $ref: '#/components/schemas/Language'
          in: path
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_translations_api_system_translations__lang__get
      summary: Get Translations
      description: Obtain translations for specific language
  /api/system/mitre:
    get:
      tags:
        - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_mitre_data_api_system_mitre_get
      summary: Get Mitre Data
      description: Obtain MITRE tactics and techniques
  /api/system/info:
    get:
      tags:
        - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_default_api_system_info_get
      summary: Get Default
      description: >-
        Return general information about webservice, just to indicate that API
        is working
  '/api/system/get-terms/{terms_type}':
    get:
      tags:
        - system
      parameters:
        - name: terms_type
          schema:
            $ref: '#/components/schemas/TermsType'
          in: path
          required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_terms_api_system_get_terms__terms_type__get
      summary: Get Terms
      description: Obtain privacy policy and terms & conditions
  /api/system/errors/log:
    post:
      tags:
        - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: log_client_error_api_system_errors_log_post
      summary: Log Client Error
      description: 'Perform needed actions with error data, obtained from front-end'
  /api/system/config:
    get:
      tags:
        - system
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
      security:
        - apiKey: []
      operationId: get_config_api_system_config_get
      summary: Get Config
      description: Obtain project configuration to use on front-end
  /api/scan/url:
    post:
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_scan_file_api_scan_url_post'
      tags:
        - scan
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponsePostURL'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: scan_file_api_scan_url_post
      summary: Scan URL
      description: Scan URL resource
  /api/scan/file:
    post:
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_scan_file_api_scan_file_post'
      tags:
        - scan
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponsePostFile'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: scan_file_api_scan_file_post
      summary: Scan File
      description: >-
        Perform a scan of the uploaded file. After you submit a file for
        scanning you'll get the <b>flow_id</b> which is required to poll the
        result.
  '/api/scan/{flow_id}/report':
    get:
      tags:
        - scan
      parameters:
        - name: flow_id
          description: flow_id from scan-file or scan-url
          schema:
            title: Flow Id
            description: Flow Id from scan-file
            type: string
          in: path
          required: true
        - examples:
            basic:
              summary: basic example
              description: >-
                Fetch only general report data: file name, hash, type of file,
                report creation date and error status in case there was an error
              value:
                - general
            signal_groups:
              summary: all signal groups
              description: Fetch all signal groups
              value:
                - allSignalGroups
            tags:
              summary: all tags
              description: Fetch all tags
              value:
                - allTags
            task_reference:
              summary: status of main task
              description: Fetch status of the main scan task
              value:
                - taskReference
            subtask_references:
              summary: status of subtasks
              description: Fetch status of scan subtasks
              value:
                - subtaskReferences
            final_verdict:
              summary: final verdict
              description: Final verdict and confidence
              value:
                - finalVerdict
            simple_fields:
              summary: other simple fields
              description: Various simple fields of the report
              value:
                - opcount
                - positionInQueue
                - priority
                - expectedRemainingProcessingTimeInSeconds
                - processTime
            main_task_data:
              summary: main task result
              description: All data produced by `file` scan task (it's the main scan task)
              value:
                - 'f:all'
            file_download:
              summary: downloaded files
              description: All data produced by `file-download` scan subtask
              value:
                - 'fd:all'
            domain_resolve:
              summary: domain resolve result
              description: All data produced by `domain-resolve` scan subtask
              value:
                - 'dr:all'
            visualization:
              summary: visualization result
              description: Visualization image produced by `visualization` scan subtask
              value:
                - 'v:visualizedSample.compressedBase64'
            file_preview:
              summary: file preview images
              description: File preview images produced by `visualization` scan subtask
              value:
                - 'v:renderedImages'
            whois_lookup:
              summary: whois lookup result
              description: All data produced by `whois-lookup` scan subtask
              value:
                - 'wi:all'
            osint:
              summary: osint result
              description: All data produced by `osint` scan subtasks
              value:
                - 'o:all'
            task_subfields:
              summary: particular information
              description: >-
                Get some specific fields from task data (on example of main task
                data)
              value:
                - 'f:yaraMatches'
                - 'f:extractedFiles'
                - 'f:digests'
            combination:
              summary: various combination
              description: Get specific fields of multiple scan tasks
              value:
                - 'f:all'
                - 'fd:fileDownloadResults'
                - 'fd:extractedUrls'
                - 'o:all'
            nested_selections:
              summary: various combination of nested selections
              description: More selective information of any depth
              value:
                - general
                - subtaskReferences.state
                - 'f:yaraMatches'
                - 'f:extractedFiles.yaraMatches'
                - 'f:extractedDomains.origin.type'
                - 'o:results'
          name: filter
          description: >-
            Report fields that should be fetched. This parameter can have pretty
            complex setup. Its mostly covered in examples, but if you still have
            some questions, please contact support.
          schema:
            title: Report filter
            description: >-
              Report fields that should be fetched. This parameter can have
              pretty complex setup. Its mostly covered in examples, but if you
              still have some questions, please contact support.
            type: array
            items:
              type: string
          in: query
          required: false
        - example:
            - 'allSignalGroups(description:asc,averageSignalStrength:desc)'
            - 'allTags(tag.name:asc)'
          name: sorting
          description: Sort parameters to be applied to fetched report data
          schema:
            title: Filter sorting options
            description: Sort parameters to be applied to fetched report data
            type: array
            items:
              type: string
          in: query
          required: false
        - example:
            - emulationGraph
          name: other
          description: Extra options to get special data
          schema:
            title: Special options
            description: Extra options to get special data
            type: array
            items:
              type: string
          in: query
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: >-
                      #/components/schemas/SuccessfulResponseGetScanReportDefault
                  - $ref: >-
                      #/components/schemas/SuccessfulResponseGetScanReportFiltered
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Bad request
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Item not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_all_upload_related_reports_api_scan__flow_id__report_get
      summary: Get All Upload Related Reports
      description: >-
        Obtain all reports for given scan init. By default, if no `filter`
        parameter is sent, we only return some basic report data, just to see
        report is there
  '/api/reports/{report_id}/files':
    get:
      tags:
        - reports
      parameters:
        - name: report_id
          schema:
            title: Report Id
            type: string
          in: path
          required: true
        - name: type
          schema:
            default: all
            allOf:
              - $ref: '#/components/schemas/ReportFileType'
          in: query
          required: false
        - name: with_content
          description: Compressed base64 data
          schema:
            title: Content of files
            description: Compressed base64 data
            default: false
            type: boolean
          in: query
          required: false
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessfulResponse'
          description: Successful Response
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMessageModel'
          description: Item not found
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
        - apiKey: []
      operationId: get_all_files_api_reports__report_id__files_get
      summary: Get All Files
      description: Obtain all files for given report
  '/api/reports/{report_id}/{file_hash}':
    get:
      tags:
        - reports
      parameters:
        - name: report_id
          description: Report Id
          schema:
            title: Report Id
            description: Report Id
            type: string
          in: path
          required: true
        - name: file_hash
          description: File hash
          schema:
            title: File Hash
            description: File hash
            type: string
          in: path
