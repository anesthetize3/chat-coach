components:
  schemas:
    SuccessfulResponse:
      title: Successful Response
      type: object
      example:
        key: value
    SuccessfulResponsePostFile:
      title: File Upload Was Successful
      type: object
      properties:
        flow_id:
          type: string
        priority:
          type: object
          properties:
            applied:
              type: integer
            max_possible:
              type: integer
            note:
              type: string
      example:
        flow_id: 0123456789abcdefghijklmn
        priority:
          applied: 20
          max_possible: 100
          note: >-
            In order to receive max possible scan priority, please ensure the
            last scan request is older than 60 seconds, and do not perform more
            than 60 scan requests per hour.
    SuccessfulResponsePostURL:
      title: URL Upload Was Successful
      type: object
      properties:
        flow_id:
          type: string
        priority:
          type: object
          properties:
            applied:
              type: integer
            max_possible:
              type: integer
      example:
        flow_id: 0123456789abcdefghijklmn
        priority:
          applied: 20
          max_possible: 100
    SuccessfulResponseGetScanReportDefault:
      title: Get Scan Report - without filters
      type: object
      properties:
        flowId:
          type: string
        allFinished:
          type: boolean
        allFilesDownloadFinished:
          type: boolean
        reportsAmount:
          type: number
        priority:
          type: string
        pollPause:
          type: number
        fileSize:
          type: number
        fileReadProgressBytes:
          type: number
        reports:
          type: object
          properties:
            additionalProperties:
              type: object
              properties:
                finalVerdict:
                  $ref: '#/components/schemas/FinalVerdict'
                overallState:
                  $ref: '#/components/schemas/OverallState'
                positionInQueue:
                  description: >
                    Every scan request is put into queues with different
                    priority and it shows the position in the given queue
                  type: number
                vtRate:
                  description: >
                    If a sufficient amount of OSINT information is available,
                    vtRrate gives the proportion of positive hits. If no such
                    information is available, the value is -1. 
                  type: number
                file:
                  description: |
                    Data related to the submitted file
                  type: object
                  properties:
                    name:
                      description: |
                        Name of submitted file
                      type: string
                    hash:
                      description: |
                        Hash of submitted file
                      type: string
                    type:
                      description: |
                        Type of submitted file
                      type: string
                filesDownloadFinished:
                  description: |
                    The file has been downloaded for processing
                  type: boolean
                created_date:
                  format: date-time
                  description: |
                    Date when scan was submitted
                  type: string
                estimatedTime:
                  description: |
                    Time in seconds to be finished
                  type: number
                estimated_progress:
                  format: float
                  description: |
                    Progress of scan
                  maximum: 1
                  minimum: 0
                  type: number
      example:
        flowId: 63f6209b01b99ad33e80b936
        allFinished: true
        allFilesDownloadFinished: true
        reportsAmount: 1
        priority: least
        pollPause: 12
        fileSize: 13370880
        fileReadProgressBytes: 13370880
        reports:
          08bae608-ed5f-4ce6-8ae9-fad6b4609193:
            overallState: success_partial
            positionInQueue: 0
            finalVerdict:
              verdict: MALICIOUS
              threatLevel: 1
              confidence: 1
            vtRate: -1
            file:
              name: bad_file.exe
              hash: 834d1dbfab8330ea5f1844f6e905ed0ac19d1033ee9a9f1122ad2051c56783dc
              type: pe
            filesDownloadFinished: true
            created_date: '02/22/2023, 14:03:11'
            estimatedTime: '2'
            estimated_progress: 1
    SuccessfulResponseGetScanReportFiltered:
      title: Get Scan Report - with filters
      type: object
      properties:
        reports:
          type: object
          properties:
            additionalProperties:
              type: object
              properties:
                overallState:
                  $ref: '#/components/schemas/OverallState'
                <filtername>:
                  type: object
              additionalProperties: true
      example:
        reports:
          08bae608-ed5f-4ce6-8ae9-fad6b4609193:
            overallState: success_partial
            taskReference:
              name: transform-file
              additionalInfo:
                submitName: bad_file.exe
                submitTime: 1677074591344
                digests:
                  SHA-256: >-
                    834d1dbfab8330ea5f1844f6e905ed0ac19d1033ee9a9f1122ad2051c56783dc
              ID: 978a1611-61e6-4ee0-84df-40d2003c81aa
              state: SUCCESS
              resourceReference:
                type: TRANSFORM_FILE
                name: file
                ID: f36892f5-61a2-49ff-8a22-89b95c73a03f
              opcount: 1
              processTime: 7802
    FinalVerdict:
      title: Final Verdict
      type: object
      properties:
        verdict:
          $ref: '#/components/schemas/ReportVerdict'
        threatLevel:
          format: float
          maximum: 1
          minimum: -1
          type: number
        confidence:
          format: float
          maximum: 1
          minimum: 0
          type: number
    OverallState:
      title: Overall State
      description: >
        Describes general state of report:

        - in_queue: file scan is not started yet, file is in scan queue

        - in_progress: scan have started, no result verdict yet

        - success: the scan is finished

        - success_partial: means that some sub-task(s) had state
        `success_partial`, in case, ex., some it's lookups didn't complete in
        time

        - failed: the scan is failed

        - failed_partial: some sub-task(s) failed to execute
      enum:
        - in_queue
        - in_progress
        - success
        - success_partial
        - failed
        - failed_partial
      type: string
